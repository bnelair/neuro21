[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "pybind11",
    "numpy==1.26.4",
    "pandas",
    "h5py",
    "scipy"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyneuro21"
version = "0.0.1"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
description = "A package for EEG data processing"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
]



